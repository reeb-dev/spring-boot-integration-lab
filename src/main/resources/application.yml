spring:
  application:
    name: spring-boot-integration-lab
  datasource:
    url: ${JDBC_URL:jdbc:h2:mem:integration_lab;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  security:
    user:
      name: ${APP_USER:demo}
      password: ${APP_PASSWORD:demo}

management:
  endpoints:
    web:
      exposure:
        include: health
