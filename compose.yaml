services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integration_lab
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d integration_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
